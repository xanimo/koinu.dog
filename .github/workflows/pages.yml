# Builds koinu.dog and publishes it.
#
# koinu.wasm is not in the repository (.gitignore), so this builds it from
# kw_web.c and the crypto/ and net/ sources in the koinu submodule, at whatever
# commit the submodule is pinned to. That is the point of building here rather
# than uploading a module somebody made locally: the wasm the page runs is
# compiled from the koinu commit this site pins, so "the same files kw links" is
# checkable rather than claimed.
#
# The build is reproducible: build.sh with ziglang 0.17.0 and the pinned
# submodules gives a byte-identical koinu.wasm, so the sha256 this prints can be
# compared against a local run.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and let a run in progress finish: a cancelled deploy can
# leave the site on a half-uploaded artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      # pinned by sha: a tag is mutable and this workflow publishes
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          submodules: recursive          # koinu, and secp256k1 inside it

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      # zig is the wasm32-wasi cross compiler; the pypi package is the toolchain
      - run: pip install ziglang==0.17.0

      - name: which koinu this is built from
        run: git -C koinu log --oneline -1

      - run: ./build.sh

      - name: the wasm this deploy is publishing
        run: sha256sum koinu.wasm

      # Only what the page fetches: the three files plus fonts/, which it serves
      # itself rather than calling out to google for. The repository root also
      # holds kw_web.c, build.sh and the whole koinu submodule, and none of that
      # belongs on a web server.
      #
      # CNAME is the exception: it is not fetched, it tells Pages the custom
      # domain. A deploy whose artifact lacks it can clear the setting, so it
      # ships with every build rather than living only in the repository UI.
      - name: stage the site
        run: |
          mkdir -p _site
          cp index.html koinu.js koinu.wasm CNAME _site/
          cp -r fonts _site/
          ls -lR _site

      # The page prints a version in its footer and in the git tag -v line on the
      # verify page. Both read one KW_VERSION, and this is where that comes from,
      # so bumping the submodule cannot leave the page naming the old release.
      # It has done exactly that twice. Editing the staged copy, not the tracked
      # one, keeps the repository free of a number only the deploy knows.
      - name: stamp the version the submodule pins
        run: |
          v=$(sed -n 's/^#define KW_VERSION "\(.*\)".*$/\1/p' koinu/include/kw_version.h)
          [ -n "$v" ] || { echo "FAIL: no KW_VERSION in koinu/include/kw_version.h"; exit 1; }
          sed -i -e "s|var KW_VERSION = \"[^\"]*\"|var KW_VERSION = \"$v\"|" \
                 -e "s|<span data-ver=\"%s\">[^<]*</span>|<span data-ver=\"%s\">$v</span>|g" \
                 _site/index.html
          got=$(sed -n 's|.*var KW_VERSION = "\([^"]*\)".*|\1|p' _site/index.html)
          [ "$got" = "$v" ] || { echo "FAIL: stamped '$got' but the header says '$v'"; exit 1; }
          n=$(grep -c "<span data-ver=\"%s\">$v</span>" _site/index.html)
          [ "$n" = "2" ] || { echo "FAIL: stamped $n no-script fallbacks, expected 2"; exit 1; }
          echo "stamped $v into KW_VERSION and $n fallbacks"

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
